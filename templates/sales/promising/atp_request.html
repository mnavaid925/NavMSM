{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Compute ATP{% endblock %}

{% block content %}
<div class="page-title">
    <h4 class="mb-1">Compute ATP (Available-to-Promise)</h4>
    <div class="text-muted small">Reads on-hand stock + open PO arrivals - never mutates.</div>
</div>

<form method="post" novalidate>{% csrf_token %}
<div class="card"><div class="card-body" style="max-width:780px">
    {{ form|crispy }}
    <div class="mt-3">
        <button class="btn btn-primary"><i class="ri-flashlight-line me-1"></i> Compute</button>
        <a href="{% url 'sales:atp_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</div></div>
</form>
{% endblock %}
