{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}New Approval Request{% endblock %}

{% block content %}
<h4 class="mb-3">New Approval Request</h4>
<div class="card"><div class="card-body">
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary"><i class="ri-send-plane-line"></i> Submit</button>
        <a href="{% url 'wfa:request_list' %}" class="btn btn-light">Cancel</a>
    </form>
</div></div>
{% endblock %}
