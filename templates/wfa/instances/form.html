{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Start Instance{% endblock %}

{% block content %}
<h4 class="mb-3">Start Process Instance</h4>
<div class="card"><div class="card-body">
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary"><i class="ri-play-line"></i> Start</button>
        <a href="{% url 'wfa:instance_list' %}" class="btn btn-light">Cancel</a>
    </form>
</div></div>
{% endblock %}
