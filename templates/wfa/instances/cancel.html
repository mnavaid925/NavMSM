{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Cancel Instance{% endblock %}

{% block content %}
<h4 class="mb-3">Cancel Instance {{ obj.code }}</h4>
<div class="card"><div class="card-body">
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-warning"><i class="ri-stop-line"></i> Confirm Cancel</button>
        <a href="{% url 'wfa:instance_detail' obj.pk %}" class="btn btn-light">Back</a>
    </form>
</div></div>
{% endblock %}
