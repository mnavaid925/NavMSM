{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if mode == 'edit' %}Edit{% else %}New{% endif %} Report{% endblock %}
{% block content %}
<div class="page-title"><h4>{% if mode == 'edit' %}Edit{% else %}New{% endif %} Report</h4></div>
<form method="post" class="card card-body">{% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary">Save</button>
        <a href="{% url 'bi:report_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
