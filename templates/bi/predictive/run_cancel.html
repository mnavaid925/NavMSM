{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Cancel Run {{ run.run_number }}{% endblock %}
{% block content %}
<div class="page-title"><h4>Cancel Prediction Run {{ run.run_number }}</h4>
    <div class="text-muted small">Reason is required (Lesson L-14).</div>
</div>
<form method="post" class="card card-body">{% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3 d-flex gap-2">
        <button class="btn btn-warning">Cancel run</button>
        <a href="{% url 'bi:prediction_run_detail' run.pk %}" class="btn btn-outline-secondary">Back</a>
    </div>
</form>
{% endblock %}
