{% load url_tags %}
{% if page.has_other_pages %}
<nav><ul class="pagination justify-content-center mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% querystring_replace page=page.previous_page_number %}">&laquo;</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% querystring_replace page=page.next_page_number %}">&raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
