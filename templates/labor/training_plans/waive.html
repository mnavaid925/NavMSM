{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Waive Training Plan{% endblock %}
{% block content %}
<div class="page-title"><h4>Waive Training Plan</h4>
    <div class="text-muted small">{{ obj.employee.full_name }} - {{ obj.program.name }}</div>
</div>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-warning"><i class="ri-skip-forward-line me-1"></i> Confirm Waive</button>
        <a href="{% url 'labor:plan_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
