{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Attendee{% endblock %}
{% block content %}
<div class="page-title"><h4>Add Attendee - {{ session.session_number }}</h4></div>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary"><i class="ri-save-line me-1"></i> Save</button>
        <a href="{% url 'labor:session_detail' session.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
