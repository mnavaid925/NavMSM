{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Upload Document for {{ employee.employee_number }}{% endblock %}
{% block content %}
<div class="page-title"><h4>Upload Document - {{ employee.full_name }}</h4></div>
<div class="card"><div class="card-body">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary"><i class="ri-upload-line me-1"></i> Upload</button>
        <a href="{% url 'labor:employee_detail' employee.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
