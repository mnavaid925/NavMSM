{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Draft Recall Notice{% endblock %}
{% block content %}
<div class="page-title d-flex justify-content-between align-items-center">
    <h4>Draft Recall Notice <span class="text-muted small">— for {{ recall.recall_number }}</span></h4>
    <a href="{% url 'compliance:recall_detail' recall.pk %}" class="btn btn-sm btn-outline-secondary">Back</a>
</div>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{{ form|crispy }}<div class="d-flex gap-2 mt-3"><button type="submit" class="btn btn-primary">Draft</button><a href="{% url 'compliance:recall_detail' recall.pk %}" class="btn btn-outline-secondary">Cancel</a></div></form>
</div></div>
{% endblock %}
