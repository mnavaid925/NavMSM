{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}New Approval Request{% endblock %}

{% block content %}
<div class="page-title d-flex justify-content-between align-items-center">
    <div><h4 class="mb-1">New Approval Request</h4></div>
    <a href="{% url 'dms:approval_list' %}" class="btn btn-outline-secondary"><i class="ri-arrow-left-line me-1"></i> Back</a>
</div>

<div class="card"><div class="card-body">
    <form method="post" novalidate>{% csrf_token %}
        {{ form|crispy }}
        <div class="text-end">
            <a href="{% url 'dms:approval_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary">Submit for approval</button>
        </div>
    </form>
</div></div>
{% endblock %}
