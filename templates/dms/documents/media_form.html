{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Media - {{ version }}{% endblock %}

{% block content %}
<div class="page-title d-flex justify-content-between align-items-center">
    <div><h4 class="mb-1">Add Media Attachment</h4><div class="text-muted small">{{ version }}</div></div>
    <a href="{% url 'dms:document_detail' version.document_id %}" class="btn btn-outline-secondary"><i class="ri-arrow-left-line me-1"></i> Back</a>
</div>

<div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
        {{ form|crispy }}
        <div class="text-end">
            <a href="{% url 'dms:document_detail' version.document_id %}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary">Attach</button>
        </div>
    </form>
</div></div>
{% endblock %}
