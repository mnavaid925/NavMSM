{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}New WIP Entry{% endblock %}
{% block content %}
<div class="page-title"><h4>New WIP Entry</h4></div>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{{ form|crispy }}
<div class="d-flex gap-2 mt-3"><button class="btn btn-primary"><i class="ri-save-line me-1"></i> Post Entry</button><a href="{% url 'cost:wip_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
</form>
</div></div>
{% endblock %}
